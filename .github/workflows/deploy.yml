name: Publicar Imagen en Docker Hub

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.14.6

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest bandit

      - name: Escaneo de seguridad (bandit)
        run: bandit -r . -s B101

      - name: Ejecutar pruebas
        run: pytest

  build-and-push:
    needs: test-and-security
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: jhongaleano/mi-api:latest
          no-cache: true

      - name: Escanear contenedor con trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'jhongaleano/mi-api:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: subir imagen a Docker hub
        run: docker push jhongaleano/mi-api:latest

        
      - name: desplgue en cloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_KEY }}
          script: |
            cd ~/Docker_github
            docker pull jhongaleano/mi-api:latest
            docker compose up -d